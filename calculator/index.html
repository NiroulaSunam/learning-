<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="screen">
            <div class="text">Any Text </div>

            <div class="button-grid">
                <button class="bento-card num">7</button>
                <button class="bento-card num">8</button>
                <button class="bento-card num">9</button>  
                <button class="bento-card utility">←</button>
                <button class="bento-card utility">C</button>

                <button class="bento-card num">4</button>
                <button class="bento-card num">5</button>
                <button class="bento-card num">6</button>  
                <button class="bento-card operator">x</button>
                <button class="bento-card operator">÷</button>

                <button class="bento-card num">1</button>
                <button class="bento-card num">2</button>
                <button class="bento-card num">3</button>  
                <button class="bento-card operator">-</button>
                <button class="bento-card operator double-height">=</button>

                <button class="bento-card float">.</button>
                <button class="bento-card num">0</button>
                <button class="bento-card float"> </button>
                <button class="bento-card operator">+</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
